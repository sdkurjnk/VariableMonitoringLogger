name: Bug Report
description: File a report to help us identify and fix a bug.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: "Description"
      placeholder: "A clear and concise description of what the bug is."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      placeholder: "A clear and concise description of what you expected to happen."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / Visuals"
      placeholder: "Drag and drop screenshots or videos here to help explain your problem."
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: "Environment"
      placeholder: "e.g. OS: macOS, Browser: Chrome 120, Version: v1.2.3"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      placeholder: "Add any other context, error logs, or thoughts here."
    validations:
      required: false